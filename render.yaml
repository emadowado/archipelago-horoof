# Render Blueprint — أرخبيل الحروف
# New > Blueprint > pick this repo. Creates a free web service + a free Postgres.
# NOTE: free Postgres expires 30 days after creation (14-day grace to upgrade).
#       For the Ramadan season switch the database plan to a paid one, e.g. "0.1c-256mb".
services:
  - type: web
    name: archipelago-horoof
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: archipelago-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true   # visible in the Render dashboard > Environment

databases:
  - name: archipelago-db
    plan: free
    region: frankfurt
    databaseName: archipelago
    user: archipelago
