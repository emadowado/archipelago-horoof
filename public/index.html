<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#061219" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="أرخبيل الحروف — مسابقة حروف مع عماد، رمضان 2027" />
  <title>أرخبيل الحروف — حروف مع عماد</title>
  <link rel="preload" href="/fonts/Lalezar.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/Cairo.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/img/hero.webp" as="image" />
  <link rel="icon" href="/img/coin.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="/img/anchor.webp" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- ═════════════ Splash / loading ═════════════ -->
  <div id="splash" class="splash">
    <img src="/img/coin.webp" alt="" class="splash-coin" />
    <div class="splash-title">أرخبيل الحروف</div>
  </div>

  <!-- ═════════════ Login ═════════════ -->
  <section id="view-login" class="view view-login" hidden>
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-inner">
      <header class="brand">
        <div class="brand-kicker">حروف مع عماد • رمضان ٢٠٢٧</div>
        <h1 class="brand-title">أرخبيل الحروف</h1>
        <div class="brand-sub">١٩ يوم، ٢٢ جزيرة، وكنز واحد يستاهل</div>
      </header>

      <div class="paper login-card">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" class="tab is-active" data-tab="login" aria-selected="true">دخول</button>
          <button type="button" role="tab" class="tab" data-tab="register" aria-selected="false">انضمام لطاقم</button>
        </div>

        <form id="form-login" class="form" autocomplete="on" novalidate>
          <label class="field">
            <span>اسم القرصان</span>
            <input name="name" id="login-name" autocomplete="username" required maxlength="40" placeholder="مثلاً: صقر البحر" />
          </label>
          <label class="field">
            <span>الرمز السري</span>
            <input name="pin" id="login-pin" type="password" autocomplete="current-password" required maxlength="64" placeholder="••••" />
          </label>
          <p class="form-error" id="login-error" role="alert"></p>
          <button type="submit" class="btn btn-gold btn-lg" id="btn-login">
            <span>اركب السفينة</span>
          </button>
        </form>

        <form id="form-register" class="form" autocomplete="off" novalidate hidden>
          <label class="field">
            <span>اختر اسم القرصان</span>
            <input name="name" id="reg-name" required maxlength="24" placeholder="اسم يعرفونك فيه" />
          </label>
          <label class="field">
            <span>رمز سري (٤ إلى ٨ أرقام)</span>
            <input name="pin" id="reg-pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password" required maxlength="8" placeholder="••••" />
          </label>
          <label class="field">
            <span>كود الطاقم (من عماد)</span>
            <input name="code" id="reg-code" required maxlength="6" autocapitalize="characters" dir="ltr" placeholder="ABC123" />
          </label>
          <p class="form-error" id="reg-error" role="alert"></p>
          <button type="submit" class="btn btn-gold btn-lg"><span>انضم للطاقم</span></button>
        </form>
      </div>

      <button type="button" class="link-btn" id="btn-spectate">تفرّج على الخريطة بدون دخول ←</button>
    </div>
  </section>

  <!-- ═════════════ Game ═════════════ -->
  <section id="view-game" class="view view-game" hidden>
    <div id="viewport" class="viewport">
      <div id="world" class="world">
        <div class="map-paper" aria-hidden="true">
          <div class="map-frame"></div>
        </div>
        <div class="sea" aria-hidden="true">
          <div class="sea-shimmer"></div>
          <div class="sea-depth"></div>
        </div>
        <svg id="map-svg" class="map-svg" viewBox="0 0 1400 1400" aria-hidden="true"></svg>
        <div id="islands-layer" class="islands-layer"></div>
        <svg id="route-svg" class="route-svg" viewBox="0 0 1400 1400" aria-hidden="true"></svg>
        <div id="whale-layer" class="whale-layer"></div>
        <div id="ships-layer" class="ships-layer"></div>
      </div>
    </div>

    <header class="topbar">
      <button type="button" class="icon-btn" id="btn-menu" aria-label="القائمة">
        <span class="avatar" id="avatar">ق</span>
      </button>
      <div class="top-center">
        <div class="top-title">أرخبيل الحروف</div>
        <div class="day-chip" id="day-chip"><span id="day-text">اليوم ٧</span><i class="dot"></i><span id="phase-text">مرحلة الاختيار</span></div>
      </div>
      <button type="button" class="board-btn" id="btn-board" aria-label="الترتيب">
        <img src="/img/coin.webp" alt="" />
        <span>الترتيب</span>
      </button>
    </header>

    <div class="map-tools">
      <button type="button" class="tool-btn" id="zoom-in" aria-label="تكبير">+</button>
      <button type="button" class="tool-btn" id="zoom-out" aria-label="تصغير">−</button>
      <button type="button" class="tool-btn" id="zoom-fit" aria-label="الخريطة كاملة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tool-btn" id="zoom-me" aria-label="سفينتي" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="hud" id="hud"></div>
  </section>

  <!-- ═════════════ Admin ═════════════ -->
  <section id="view-admin" class="view view-admin" hidden></section>

  <!-- ═════════════ Overlays ═════════════ -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sheet-grab" aria-hidden="true"></div>
    <button type="button" class="sheet-close" id="sheet-close" aria-label="إغلاق">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <div class="sheet-body" id="sheet-body"></div>
  </aside>
  <div id="cinema" class="cinema" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/game.js"></script>
  <script src="/app.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
